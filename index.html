<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24인 실시간 칠판 클래스룸</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'MapleStory', 'Nanum Gothic', sans-serif;
            background: #1e2923;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 헤더 */
        header {
            background: #2b1d0c;
            border-bottom: 4px solid #5a3d1e;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header-title {
            font-size: 1.2rem;
            color: #f3e5ab;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-setup {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #5a3d1e;
            background: #fff8e7;
            color: #333;
            font-weight: bold;
            outline: none;
        }

        /* 메인 레이아웃 */
        .main-container {
            flex: 1;
            display: flex;
            padding: 15px;
            gap: 15px;
            height: calc(100vh - 60px);
        }

        /* 칠판 영역 */
        .board-container {
            flex: 3;
            background: #234731;
            border: 14px solid #6e4726;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 8px 16px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        canvas {
            flex: 1;
            cursor: crosshair;
            touch-action: none;
        }

        /* 칠판 하단 툴바 */
        .toolbar {
            background: #183322;
            padding: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid #2d5a3f;
        }
        .tools-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn {
            background: #4a3319;
            color: #f3e5ab;
            border: 1px solid #8c5a2b;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #6e4726;
            transform: translateY(-1px);
        }
        .btn-raise {
            background: #d97706;
            color: #fff;
            font-weight: bold;
        }
        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            transition: transform 0.1s;
        }
        .color-dot.active {
            transform: scale(1.2);
            box-shadow: 0 0 8px #fff;
        }

        /* 오른쪽 채팅 및 참가지 창 */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 280px;
            max-width: 360px;
        }
        .panel {
            background: #15251b;
            border: 2px solid #2d4734;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-title {
            background: #233d2c;
            padding: 8px 12px;
            font-size: 0.9rem;
            color: #a3e635;
            font-weight: bold;
            border-bottom: 1px solid #2d4734;
        }
        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 300px;
        }
        .msg {
            background: #1e3627;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-all;
        }
        .msg .sender {
            color: #facc15;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .chat-input-box {
            display: flex;
            padding: 8px;
            background: #15251b;
            gap: 6px;
        }
        .chat-input-box input {
            flex: 1;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>🏫 우리들의 실시간 칠판 교실</span>
        </div>
        <div class="user-setup">
            <label for="userName">내 이름:</label>
            <input type="text" id="userName" value="학생 1" maxlength="8">
        </div>
    </header>

    <div class="main-container">
        <!-- 칠판 영역 -->
        <div class="board-container">
            <canvas id="board"></canvas>
            
            <div class="toolbar">
                <div class="tools-group">
                    <div class="color-dot active" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
                    <div class="color-dot" style="background: #fef08a;" onclick="setColor('#fef08a', this)"></div>
                    <div class="color-dot" style="background: #fca5a5;" onclick="setColor('#fca5a5', this)"></div>
                    <div class="color-dot" style="background: #86efac;" onclick="setColor('#86efac', this)"></div>
                    <div class="color-dot" style="background: #93c5fd;" onclick="setColor('#93c5fd', this)"></div>
                    
                    <span style="margin-left: 10px; font-size: 0.8rem;">두께:</span>
                    <input type="range" id="brushSize" min="2" max="20" value="4" style="width: 70px;">
                </div>

                <div class="tools-group">
                    <button class="btn" onclick="setEraser()">지우개</button>
                    <button class="btn" onclick="clearBoard(true)">전체 지우기</button>
                    <button class="btn btn-raise" onclick="raiseHand()">✋ 손들기</button>
                </div>
            </div>
        </div>

        <!-- 채팅 영역 -->
        <div class="sidebar">
            <div class="panel" style="flex: 1;">
                <div class="panel-title">💬 실시간 대화창</div>
                <div class="chat-messages" id="chatMsg">
                    <div class="msg"><span class="sender">알림:</span> 교실에 입주했습니다! 그림과 채팅으로 소통해보세요.</div>
                </div>
                <div class="chat-input-box">
                    <input type="text" id="chatInput" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button class="btn" onclick="sendChat()">전송</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 네트워크 브로드캐스트 채널 (동일 브라우저/탭 간 실시간 연동)
        const channel = new BroadcastChannel('chalkboard_room');
        
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const userNameInput = document.getElementById('userName');
        
        // 이름 자동 생성 (랜덤)
        userNameInput.value = '학생 ' + Math.floor(Math.random() * 100 + 1);

        let isDrawing = false;
        let currentColor = '#ffffff';
        let currentSize = 4;
        let isEraser = false;

        // 캔버스 크기 맞춤
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height - 50; // 툴바 높이 제외
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 드로잉 로직
        function startDraw(e) {
            isDrawing = true;
            draw(e);
        }

        function stopDraw() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            const drawData = {
                x, y,
                color: isEraser ? '#234731' : currentColor,
                size: isEraser ? currentSize * 4 : currentSize
            };

            renderStroke(drawData);

            // 다른 사용자에게 드로잉 전송
            channel.postMessage({ type: 'draw', data: drawData });
        }

        function renderStroke(data) {
            ctx.lineWidth = data.size;
            ctx.lineCap = 'round';
            ctx.strokeStyle = data.color;

            ctx.lineTo(data.x, data.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(data.x, data.y);
        }

        // 색상 선택
        function setColor(color, el) {
            isEraser = false;
            currentColor = color;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        // 지우개 선택
        function setEraser() {
            isEraser = true;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        }

        // 브러시 크기 변경
        document.getElementById('brushSize').addEventListener('input', (e) => {
            currentSize = e.target.value;
        });

        // 칠판 지우기
        function clearBoard(broadcast = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (broadcast) {
                channel.postMessage({ type: 'clear' });
            }
        }

        // 채팅 및 알림 전송
        function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const name = userNameInput.value || '익명';
            addChatMessage(name, text);
            channel.postMessage({ type: 'chat', name, text });

            input.value = '';
        }

        function addChatMessage(name, text) {
            const container = document.getElementById('chatMsg');
            const msgEl = document.createElement('div');
            msgEl.className = 'msg';
            msgEl.innerHTML = `<div class="sender">${name}</div><div>${text}</div>`;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        // 손들기 기능
        function raiseHand() {
            const name = userNameInput.value || '익명';
            const text = "✋ 손을 들었습니다!";
            addChatMessage(name, text);
            channel.postMessage({ type: 'chat', name, text });
        }

        // 이벤트 리스너 (마우스 & 터치 지원)
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
        canvas.addEventListener('touchend', stopDraw);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

        // 실시간 수신 처리
        channel.onmessage = (event) => {
            const { type, data, name, text } = event.data;
            if (type === 'draw') {
                renderStroke(data);
            } else if (type === 'clear') {
                clearBoard(false);
            } else if (type === 'chat') {
                addChatMessage(name, text);
            }
        };
    </script>
</body>
</html>
